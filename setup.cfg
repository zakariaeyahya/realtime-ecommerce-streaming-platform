[tool:pytest]
testpaths = tests
asyncio_mode = strict

[coverage:run]
source = .
omit =
    scripts/*
    lakehouse/*
    tests/*
    */migrations/*
    setup.py
    venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__
    raise NotImplementedError
show_missing = true
