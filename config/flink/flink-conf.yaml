# =============================================================================
# Apache Flink Configuration - E-Commerce Streaming Platform
# =============================================================================
# Reference: https://nightlies.apache.org/flink/flink-docs-release-1.18/docs/deployment/config/

# -----------------------------------------------------------------------------
# JobManager
# -----------------------------------------------------------------------------
jobmanager.rpc.address: jobmanager
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m

# -----------------------------------------------------------------------------
# TaskManager
# -----------------------------------------------------------------------------
taskmanager.numberOfTaskSlots: 4
taskmanager.memory.process.size: 1728m

# -----------------------------------------------------------------------------
# Parallelism
# -----------------------------------------------------------------------------
# Local: 4, Production: 48
parallelism.default: 4

# -----------------------------------------------------------------------------
# State Backend (RocksDB)
# -----------------------------------------------------------------------------
state.backend: rocksdb
state.checkpoints.dir: file:///flink/checkpoints
state.savepoints.dir: file:///flink/savepoints

# -----------------------------------------------------------------------------
# Checkpointing
# -----------------------------------------------------------------------------
execution.checkpointing.interval: 30s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.min-pause: 10s
execution.checkpointing.timeout: 10min
state.checkpoints.num-retained: 3

# -----------------------------------------------------------------------------
# Restart Strategy
# -----------------------------------------------------------------------------
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 3
restart-strategy.fixed-delay.delay: 10s

# -----------------------------------------------------------------------------
# Web UI
# -----------------------------------------------------------------------------
web.port: 8081
web.submit.enable: true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
env.log.level: INFO
